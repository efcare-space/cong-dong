<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>EFCommunity · Quản trị ID và Data</title><link rel="icon" href="icon-192.png"><style>
:root{--bg:#f3f5f9;--surface:#fff;--ink:#16233a;--mut:#5c6b84;--line:#dde4ef;--navy:#0b1f3f;--blue:#1d5fd1;--g:#1f7a55;--gbg:#e2f3ea;--r:#b8342a;--rbg:#fbe1de;--y:#7a5410;--ybg:#fcefd2;--b:#1d5fd1;--bbg:#e4edfb;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1{font-size:24px;margin:10px 0 6px}h2{font-size:21px;margin-bottom:12px}h3{font-size:15.5px;margin-bottom:8px}
.mut{color:var(--mut)}.sm{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border:0;border-radius:10px;padding:8px 16px;font-weight:700;background:var(--blue);color:#fff;cursor:pointer;text-decoration:none}
.btn.alt{background:#e8effb;color:var(--blue)}.btn.no{background:var(--rbg);color:var(--r)}.btn.ghost{background:transparent;color:#dbe7ff;border:1px solid rgba(255,255,255,.3)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}.btn[disabled]{opacity:.5}
input,select,textarea{width:100%;border:1.5px solid #c5d1e6;border-radius:10px;padding:9px 12px;background:#fff;min-height:42px}
label{display:block;font-weight:700;font-size:13.5px;margin:10px 0 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.row.wrap>*{flex:0 0 auto}.row.wrap select{width:auto;flex:1 1 200px}.row.wrap input{flex:1 1 220px;width:auto}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap;background:#edf1f7;color:var(--mut)}
.chip.g{background:var(--gbg);color:var(--g)}.chip.r{background:var(--rbg);color:var(--r)}.chip.y{background:var(--ybg);color:var(--y)}.chip.b{background:var(--bbg);color:var(--b)}
.login{max-width:440px;margin:40px auto;padding:0 16px;text-align:center}.login .card{text-align:left;margin-top:16px}.login .btn{width:100%;margin-top:14px}.lgbig{width:96px;background:#fff;border-radius:22px;padding:10px;border:1px solid var(--line)}
.demo .row{margin-top:10px}.demo .btn{flex:1;margin-top:0}
header.top{background:linear-gradient(160deg,#0b1f3f,#143572);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 18px;gap:12px;position:sticky;top:0;z-index:5}
.brand{display:flex;gap:10px;align-items:center}.brand img{width:40px;height:40px;background:#fff;border-radius:10px;padding:3px}.brand b{display:block}.brand small{color:#b9cdf5}.tr{display:flex;gap:8px}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 60px)}
.side{background:#fff;border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:4px}
.side button{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:10px;padding:10px 12px;font-weight:600;color:var(--mut);cursor:pointer;text-align:left;min-height:44px}
.side button span{width:20px;text-align:center}.side button.on{background:#e8effb;color:var(--blue)}.side button i{margin-left:auto;font-style:normal;font-size:12px;background:var(--r);color:#fff;border-radius:999px;padding:0 7px}.side button i:empty{display:none}
main{padding:20px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.kpi b{display:block;font-size:22px;color:var(--navy);font-variant-numeric:tabular-nums}.kpi span{font-size:12.5px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
svg{width:100%;height:auto}svg .b{fill:#9db7e6}svg .b.last{fill:var(--blue)}svg .ax{stroke:var(--line)}svg .v{font-size:10px;fill:var(--mut);text-anchor:middle}svg .lb{font-size:11px;fill:var(--mut)}
.fr{display:flex;justify-content:space-between;font-size:13.5px;margin-top:8px}.bar{height:8px;background:#e6ecf6;border-radius:5px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--g)}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid var(--line);padding:8px 0}.li:first-of-type{border-top:0}
.filters{display:grid;grid-template-columns:2fr repeat(5,1fr);gap:8px;margin-bottom:10px}
.tbl{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:900px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--mut);background:#f7f9fc;position:sticky;top:0}
tbody tr[data-hs]{cursor:pointer}tbody tr[data-hs]:hover{background:#f4f8ff}
.pg{justify-content:center;margin-top:10px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;box-shadow:-10px 0 30px rgba(0,0,0,.15);transform:translateX(105%);transition:transform .25s;z-index:20;overflow-y:auto}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;gap:10px;padding:18px 18px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}.dh p{margin-top:4px}
.x{border:0;background:#eef2f8;border-radius:10px;min-width:40px;min-height:40px;font-size:20px;cursor:pointer}
.dk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 18px}.dk div{background:#f4f7fc;border-radius:10px;padding:8px;text-align:center}.dk b{display:block;font-size:18px}.dk span{font-size:11.5px;color:var(--mut)}
.ds{padding:12px 18px;border-top:1px solid var(--line)}.ds textarea{margin:8px 0}
.note{background:#f7f9fc;border-radius:10px;padding:8px 10px;margin-top:8px}
.tl{display:grid;grid-template-columns:120px 1fr;gap:8px;font-size:13.5px;padding:6px 0;border-top:1px dashed var(--line)}.tl small{color:var(--mut)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:12px}.qr{width:140px;height:140px;margin-bottom:10px}.qr img,.qr canvas{width:140px;height:140px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0b1f3f;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90%}.toast.on{opacity:1}
.demo-bar{background:#7a5410;color:#fff;font-size:13px;text-align:center;padding:5px 12px}.demo-bar.live{background:#13795b}
@media (max-width:800px){.layout{grid-template-columns:1fr}.side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.side button{flex:0 0 auto}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.tr .btn:first-child{display:none}}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}

</style></head><body>

  const r = await api('dataThanhVien', S.phien, S.loc); if (!r.ok) { $('list').innerHTML = esc(r.msg); return; }
  const pages = Math.max(1, Math.ceil(r.tong / 50));
  $('list').innerHTML = `<p class="mut">${r.tong} người</p><div class="tbl"><table><thead><tr><th>Tên</th><th>Mã</th><th>SĐT</th><th>Năm sinh</th><th>Khu vực</th><th>Kênh</th><th>Bậc</th><th>Việc</th><th>Giờ</th><th>Ngày tạo</th><th>Trạng thái</th></tr></thead><tbody>${r.items.map(x => `<tr data-hs="${x.efc}" tabindex="0"><td><b>${esc(x.ten)}</b>${x.thayMat ? `<br><small class="mut">do ${esc(x.thayMat)} tạo hộ</small>` : ''}</td><td>${esc(x.efc)}</td><td>${esc(x.sdt) || '–'}</td><td>${x.namSinh || ''}</td><td>${esc(x.khuVuc)}</td><td>${esc(kenhTen(x.kenh))}</td><td>${x.bac ? chip(x.bac, 'b') : ''}</td><td>${x.soViec}</td><td>${fmt(x.soDu)}</td><td>${day(x.tao)}</td><td>${chip((TT[x.trangThai] || [x.trangThai])[0], (TT[x.trangThai] || ['', 'm'])[1])}</td></tr>`).join('') || '<tr><td colspan="11">Không có ai khớp bộ lọc.</td></tr>'}</tbody></table></div>
${pages > 1 ? `<div class="row pg"><button class="btn alt sm" id="pv"${S.loc.trang <= 1 ? ' disabled' : ''}>‹ Trước</button><span class="mut">Trang ${S.loc.trang}/${pages}</span><button class="btn alt sm" id="nx"${S.loc.trang >= pages ? ' disabled' : ''}>Sau ›</button></div>` : ''}`;
  if ($('pv')) { $('pv').onclick = () => { S.loc.trang--; loadList(); }; $('nx').onclick = () => { S.loc.trang++; loadList(); }; }
  bindHS();
}
function bindHS() { document.querySelectorAll('[data-hs]').forEach(e => { e.onclick = () => openHS(e.dataset.hs); e.onkeydown = k => { if (k.key === 'Enter') openHS(e.dataset.hs); }; }); }

/* ---------- hồ sơ 360 ---------- */
function closeDrawer() { const d = $('drawer'); if (d) d.classList.remove('on'); }
async function openHS(efc) {
  const d = $('drawer'); d.classList.add('on'); d.innerHTML = '<p class="mut" style="padding:20px">Đang tải hồ sơ...</p>';
  const r = await api('dataHoSo', S.phien, efc); if (!r.ok) { d.innerHTML = `<p style="padding:20px">${esc(r.msg)}</p>`; return; }
  const tv = r.tv, t = r.thongKe, tram = (await api('dataTram', S.phien)).items || [];
  const xm = k => tv.xm[k] === 'dat' ? chip('Đạt', 'g') : tv.xm[k] === 'cho' ? chip('Chờ xác minh', 'y') : tv.xm[k] === 'khong' ? chip('Chưa đạt', 'r') : chip('Chưa có', 'm');
  d.innerHTML = `<div class="dh"><div><h2>${esc(tv.ten)}</h2><p class="mut">${esc(tv.efc)} · ${esc(tv.sdt) || 'chưa có SĐT'} · sinh ${tv.namSinh || '?'} · ${esc(tv.khuVuc) || 'chưa khai khu vực'}</p><p>${chip((TT[tv.trangThai] || [tv.trangThai])[0], (TT[tv.trangThai] || ['', 'm'])[1])} ${r.bac ? chip(r.bac + ' · ' + BAC[r.bac], 'b') : ''} ${chip(kenhTen(tv.kenh), 'm')} ${tv.coPIN ? '' : chip('Tạo hộ, chưa có PIN', 'y')}</p></div><button class="x" id="dx" aria-label="Đóng">×</button></div>
<div class="dk"><div><b>${fmt(r.soDu)}</b><span>giờ trong ví</span></div><div><b>${t.soCa}</b><span>việc tử tế</span></div><div><b>${t.soNguoi}</b><span>người được giúp</span></div><div><b>${vnd(t.thuNhap)}</b><span>thu nhập (đ)</span></div></div>
<div class="ds"><h3>Thao tác</h3><div class="row wrap">${tv.trangThai === 'khoa' ? '<button class="btn sm" data-a="mo">Mở khoá</button>' : tv.trangThai === 'hoat_dong' ? '<button class="btn alt sm" data-a="khoa">Khoá tài khoản</button>' : ''}${tv.xm.A === 'cho' ? '<button class="btn sm" data-xm="A1">Đạt tầng A</button><button class="btn alt sm" data-xm="A0">Chưa đạt A</button>' : ''}${tv.xm.B === 'cho' ? '<button class="btn sm" data-xm="B1">Đạt tầng B</button><button class="btn alt sm" data-xm="B0">Chưa đạt B</button>' : ''}</div>
<div class="row wrap" style="margin-top:8px"><select id="h-tram" aria-label="Gắn Trạm"><option value="">Gắn với Trạm…</option>${tram.map(x => `<option value="${esc(x.ma)}"${tv.kenh === 'tram:' + x.ma ? ' selected' : ''}>${esc(x.ma)} · ${esc(x.ten)}</option>`).join('')}</select><button class="btn alt sm" data-a="tram">Lưu</button></div>
${S.laQT ? `<div class="row wrap" style="margin-top:8px">${r.vai.some(v => v.vai === 'dieu_phoi') ? '<button class="btn alt sm" data-v="dieu_phoi:1">Bỏ vai điều phối</button>' : '<button class="btn alt sm" data-v="dieu_phoi:0">Gắn vai điều phối</button>'}${tv.trangThai === 'yeu_cau_xoa' || tv.trangThai === 'hoat_dong' ? '<input id="x-cc" placeholder="Căn cứ xoá, ví dụ yêu cầu ngày 04/11" aria-label="Căn cứ xoá"><button class="btn no sm" data-a="xoa">Xoá theo yêu cầu</button>' : ''}</div>` : ''}</div>
<div class="ds"><h3>Ghi chú điều phối</h3><div class="row wrap"><select id="g-loai" aria-label="Loại ghi chú"><option value="goi_chao_mung">Gọi chào mừng</option><option value="lien_he">Liên hệ</option><option value="ho_tro">Hỗ trợ</option><option value="canh_bao">Cảnh báo</option><option value="khac">Khác</option></select></div><textarea id="g-nd" rows="2" placeholder="Nội dung (không ghi thông tin bệnh)"></textarea><button class="btn sm" data-a="ghichu">Lưu ghi chú</button>${r.ghiChu.map(g => `<div class="note"><small class="mut">${dt(g.luc)} · ${esc(g.tacGia)} · ${esc(g.loai)}</small><p>${esc(g.noiDung)}</p></div>`).join('')}</div>
<div class="ds"><h3>Vai và quan hệ</h3>${r.vai.map(v => chip(v.vai + (v.tenOrg ? ' · ' + v.tenOrg : ''), 'b')).join(' ') || '<span class="mut">Thành viên</span>'}${r.quanHe.map(q => `<div class="li"><span>${esc(q.loai)}: ${esc(q.tenA)} → ${esc(q.tenB)}${q.ghiChu ? ' (' + esc(q.ghiChu) + ')' : ''}</span></div>`).join('')}${tv.nguoiTao ? `<p class="mut sm">Tài khoản do ${esc(tv.nguoiTao)} tạo hộ.</p>` : ''}</div>
<div class="ds"><h3>Kỹ năng, xác minh</h3>${r.hoSo.map(h => `<div class="li"><span>${esc(h.kyNang)}</span><span>${chip((NG[h.nguon] || h.nguon) + (h.soXacNhan ? ' · ' + h.soXacNhan + ' xác nhận' : ''), 'm')}</span></div>`).join('') || '<p class="mut">Chưa có kỹ năng.</p>'}<div class="li"><span>Tầng C</span>${xm('C')}</div><div class="li"><span>Tầng B</span>${xm('B')}</div><div class="li"><span>Tầng A</span>${xm('A')}</div>${tv.chungChi ? `<p class="mut sm">Ghi chú xác minh: ${esc(tv.chungChi)}</p>` : ''}</div>
<div class="ds"><h3>Đồng ý</h3>${r.dongY.map(x => `<div class="li"><span>${esc(MD[x.mucDich] || x.mucDich)}<br><small class="mut">${esc(x.cach)} · ${dt(x.luc)}</small></span>${chip(x.co ? 'Có' : 'Không', x.co ? 'g' : 'r')}</div>`).join('')}</div>
<div class="ds"><h3>Dòng thời gian</h3><p class="mut sm">Hoạt động gần nhất: ${dt(r.lanCuoi) || '–'}</p>${r.dongThoiGian.map(x => `<div class="tl"><small>${dt(x.luc)}</small><span>${esc(x.t)}</span></div>`).join('')}</div>`;
  $('dx').onclick = closeDrawer;
  const reload = () => { openHS(efc); if (S.tab === 'thanhvien') loadList(); };
  d.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    const a = b.dataset.a;
    if (a === 'mo') run(b, 'dataCapNhat', [S.phien, efc, { trangThai: 'hoat_dong' }], () => { toast('Đã mở khoá.'); reload(); });
    if (a === 'khoa') run(b, 'dataCapNhat', [S.phien, efc, { trangThai: 'khoa' }], () => { toast('Đã khoá và đăng xuất mọi thiết bị.'); reload(); });
    if (a === 'tram') run(b, 'dataCapNhat', [S.phien, efc, { tram: $('h-tram').value }], () => { toast('Đã gắn Trạm.'); reload(); });
    if (a === 'ghichu') run(b, 'dataGhiChu', [S.phien, efc, $('g-loai').value, $('g-nd').value], () => { toast('Đã lưu ghi chú.'); reload(); });
    if (a === 'xoa') run(b, 'dataXoaTheoYeuCau', [S.phien, efc, $('x-cc').value], () => { toast('Đã xoá theo yêu cầu.'); reload(); });
  });
  d.querySelectorAll('[data-xm]').forEach(b => b.onclick = () => run(b, 'dpXacMinh', [S.phien, efc, b.dataset.xm[0], b.dataset.xm[1] === '1'], () => { toast('Đã lưu xác minh.'); reload(); }));
  d.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { const [v, bo] = b.dataset.v.split(':'); run(b, 'dataGanVai', [S.phien, efc, v, bo === '1'], () => { toast('Đã cập nhật vai.'); reload(); }); });
}

/* ---------- Trạm ---------- */
V.tram = async () => {
  const r = await api('dataTram', S.phien); if (!r.ok) return;
  $('main').innerHTML = `<h2>Trạm</h2><p class="mut">Mỗi Trạm có một mã QR. Người quét mã và tạo tài khoản sẽ được ghi kênh đến là Trạm đó.</p><div class="tgrid">${r.items.map(x => { const link = APP + '?tram=' + encodeURIComponent(x.ma); return `<div class="card"><div class="qr" id="qr-${esc(x.ma)}" data-link="${esc(link)}"></div><h3>${esc(x.ten)}</h3><p class="mut sm">${esc(x.ma)} · ${esc(x.diaChi)}<br>${esc(x.khuVuc)} · phụ trách: ${esc(x.phuTrach) || 'chưa có'}</p><p><b>${x.thanhVien}</b> thành viên đến từ Trạm</p><input readonly value="${esc(link)}" aria-label="Link Trạm" onclick="this.select()"></div>`; }).join('') || '<p class="mut">Chưa có Trạm.</p>'}</div>
${r.laQT ? `<div class="card" style="max-width:520px"><h3>Thêm Trạm</h3><label for="t-ma">Mã Trạm</label><input id="t-ma" placeholder="DV02"><label for="t-ten">Tên</label><input id="t-ten" placeholder="Trạm Ngũ Tâm …"><label for="t-dc">Địa chỉ</label><input id="t-dc"><label for="t-kv">Khu vực</label><input id="t-kv" placeholder="Phường, quận"><label for="t-pt">SĐT người phụ trách (đã có tài khoản)</label><input id="t-pt" inputmode="tel"><button class="btn" id="t-go">Thêm Trạm</button></div>` : ''}`;
  document.querySelectorAll('.qr').forEach(q => { try { if (window.QRCode) new QRCode(q, { text: q.dataset.link, width: 140, height: 140, colorDark: '#0b1f3f', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); else q.textContent = 'QR'; } catch (e) { q.textContent = 'QR'; } });
  if ($('t-go')) $('t-go').onclick = () => run($('t-go'), 'dataTaoTram', [S.phien, { ma: $('t-ma').value, ten: $('t-ten').value, diaChi: $('t-dc').value, khuVuc: $('t-kv').value, sdtPhuTrach: $('t-pt').value }], () => { toast('Đã thêm Trạm.'); go('tram'); });
};

/* ---------- nhật ký, xuất ---------- */
V.nhatky = async () => {
  const r = await api('dataNhatKy', S.phien); if (!r.ok) { $('main').innerHTML = esc(r.msg); return; }
  $('main').innerHTML = `<h2>Nhật ký quản trị</h2><p class="mut">200 thao tác gần nhất: ai xem, sửa, xuất dữ liệu của ai.</p><div class="tbl"><table><thead><tr><th>Lúc</th><th>Người</th><th>Hành động</th><th>Đối tượng</th><th>Chi tiết</th></tr></thead><tbody>${r.items.map(x => `<tr><td>${dt(x.luc)}</td><td>${esc(x.nguoi)}</td><td>${esc(x.hanhDong)}</td><td>${esc(x.doiTuong)}</td><td>${esc(x.chiTiet)}</td></tr>`).join('')}</tbody></table></div>`;
};
V.xuat = () => {
  $('main').innerHTML = `<h2>Xuất dữ liệu</h2><p class="mut">Tệp CSV mở bằng Excel hoặc Google Sheets. Mỗi lần xuất được ghi nhật ký. Chỉ dùng cho điều phối, không chia sẻ ra ngoài.</p><div class="row wrap"><button class="btn" data-x="thanh_vien">Xuất danh sách thành viên</button><button class="btn alt" data-x="viec">Xuất danh sách việc</button></div><textarea id="csv" rows="8" readonly style="margin-top:12px;display:none" aria-label="Nội dung CSV"></textarea>`;
  document.querySelectorAll('[data-x]').forEach(b => b.onclick = () => run(b, 'dataXuat', [S.phien, b.dataset.x], r => {
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([r.csv], { type: 'text/csv;charset=utf-8' })); a.download = r.ten; document.body.appendChild(a); a.click(); a.remove(); } catch (e) {}
    const ta = $('csv'); ta.style.display = 'block'; ta.value = r.csv; toast('Đã tạo ' + r.ten + '. Nếu máy không tải, sao chép nội dung bên dưới.');
  }));
};
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
window.__EFQ = { S, go, openHS };
boot();
})();

</script>
</body></html>
