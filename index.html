<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b1f3f"><meta name="description" content="Cộng đồng EFCARE: giúp người, học kỹ năng, có thêm thu nhập. Một tài khoản cho tất cả."><title>EFCommunity · Cộng đồng EFCARE</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="EFCommunity"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><style>
:root{--ink:#16233a;--mut:#5c6b84;--line:#dde4ef;--bg:#f3f6fb;--card:#fff;--blue:#1d5fd1;--navy:#0b1f3f;--gtt:#13795b;--gttbg:#dcf2e8;--san:#1d5fd1;--sanbg:#e4edfb;--red:#b8342a;--redbg:#fbe1de;--warn:#7a5410;--warnbg:#fcefd2;--gold:#f4cf6a;--r:16px;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.5;min-height:100dvh}
body.nav{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.app{max-width:560px;margin:0 auto}
header.top{background:linear-gradient(160deg,#0b1f3f,#143572);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:8}
.lg{width:44px;height:44px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 44px;padding:4px}.lg img{width:100%;height:auto;display:block}
header.top .t{flex:1;min-width:0}header.top b{display:block;font-size:17px;line-height:1.2}
.rolechip{display:inline-block;margin-top:2px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.16);border:0;color:#dbe7ff;border-radius:999px;padding:2px 10px;cursor:pointer;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:12px;min-width:46px;min-height:46px;font-weight:800;cursor:pointer}
.demo-bar{background:#7a5410;color:#fff;font-size:13px;text-align:center;padding:6px 12px}
.demo-bar.live{background:#13795b}
main{padding:16px 16px 28px}
h1{font-size:25px;line-height:1.2;margin-bottom:6px}
h2{font-size:21px;line-height:1.25;margin:4px 0 6px}
h3{font-size:17px;margin:18px 0 8px}
.sub{color:var(--mut);font-size:15px;margin-bottom:12px}
.note{color:var(--mut);font-size:14px}.note.warn{color:var(--warn);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.stack{display:grid;gap:10px}
.row{display:flex;gap:10px}.row>*{flex:1}
label.t{display:block;font-weight:700;font-size:15px;margin:12px 0 6px}
input[type=text],input[type=tel],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;font-size:17px;padding:12px 14px;border:1.5px solid #c5d1e6;border-radius:12px;background:#fff;min-height:52px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(29,95,209,.15)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:14px;font-size:17px;font-weight:700;background:var(--blue);color:#fff;cursor:pointer;padding:12px 16px;text-decoration:none;text-align:center}
.btn.alt{background:#e8effb;color:var(--blue)}.btn.ok{background:var(--gtt)}.btn.no{background:var(--redbg);color:var(--red)}.btn.ghost{background:transparent;color:var(--blue);min-height:44px}
.btn.sm{min-height:44px;font-size:15px;padding:8px 14px;width:auto}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn .sp{width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;display:none}.btn.busy .sp{display:inline-block}
@keyframes s{to{transform:rotate(360deg)}}
.chk{display:flex;gap:12px;align-items:flex-start;margin-top:12px;font-size:15.5px;cursor:pointer}.chk input{width:24px;height:24px;flex:0 0 24px;margin-top:1px;accent-color:var(--gtt)}
.err{color:var(--red);font-size:14.5px;margin-top:6px;min-height:0}
.msg{border-radius:12px;padding:12px 14px;font-size:15.5px;margin:10px 0}.msg.ok{background:var(--gttbg);color:#0d5a43}.msg.no{background:var(--redbg);color:var(--red)}.msg.warn{background:var(--warnbg);color:var(--warn)}
.pill{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:2px 9px;line-height:1.6;white-space:nowrap}
.p-gtt{background:var(--gttbg);color:var(--gtt)}.p-san{background:var(--sanbg);color:var(--san)}.p-hoc{background:#efe6fb;color:#6a3fb5}.p-warn{background:var(--warnbg);color:var(--warn)}.p-no{background:var(--redbg);color:var(--red)}.p-mut{background:#edf1f7;color:var(--mut)}
.bal{background:linear-gradient(150deg,#0b1f3f,#1d5fd1);color:#fff;border-radius:18px;padding:14px 16px;margin-bottom:12px}
.bal small{color:#cfe0ff;font-size:14px}.bal b.big{font-size:34px;display:block;line-height:1.1}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stat3 div{background:rgba(255,255,255,.12);border-radius:12px;padding:8px;text-align:center}.stat3 b{font-size:20px;display:block}.stat3 span{font-size:12px;color:#cfe0ff;line-height:1.3;display:block}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.qa button{background:#fff;border:1.5px solid var(--line);border-radius:16px;min-height:86px;font-weight:700;font-size:15.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px;text-align:center}.qa button span{font-size:26px;line-height:1}.qa button.pri{background:var(--blue);border-color:var(--blue);color:#fff}.qa button span svg{display:block;color:var(--blue)}.qa button small{font-size:12px;font-weight:500;color:var(--mut);line-height:1.3}
.todo{display:flex;gap:12px;align-items:center;border-top:1px solid var(--line);padding:12px 0}.todo:first-of-type{border-top:0}.todo .ic{flex:0 0 40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--bg)}.todo .tx{flex:1;min-width:0;font-size:15px}.todo .tx b{display:block;font-size:15.5px}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid var(--line);padding:10px 0;font-size:15px}.li:first-child{border-top:0}.li .l{min-width:0}
.pos{color:var(--gtt);font-weight:800}.neg{color:var(--red);font-weight:800}
.seg{display:flex;background:#e6ecf6;border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}.seg button{flex:1;border:0;background:none;border-radius:11px;min-height:44px;font-weight:700;font-size:14.5px;color:var(--mut);cursor:pointer}.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.job{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}.job h4{font-size:17px;margin:6px 0 2px}.job .meta{color:var(--mut);font-size:14px;margin-bottom:8px}.job .price{font-weight:800;color:var(--san)}
.ph-img{width:100%;border-radius:10px;margin-bottom:8px;background:linear-gradient(135deg,#eef2f9,#e2eaf6);display:flex;align-items:center;justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1.5px solid #c5d1e6;background:#fff;border-radius:999px;padding:9px 14px;font-weight:700;font-size:15px;cursor:pointer;min-height:44px}.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1.5px solid #c5d1e6;border-radius:14px;padding:13px 14px;margin-bottom:8px;cursor:pointer;min-height:56px}.opt.on{border-color:var(--blue);background:#eef4ff}.opt[disabled]{opacity:.55;cursor:not-allowed}.opt .ic{font-size:22px;line-height:1.2}.opt b{display:block}.opt small{display:block;color:var(--mut);font-size:13.5px;margin-top:2px}
.bdg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bdg div{border-radius:14px;padding:10px 6px;text-align:center;font-size:12.5px;font-weight:700;background:#f0f3f8;color:#9aa6bb;border:1px dashed #d3dbe8}.bdg div.dat{background:#fff7dc;color:#7a5410;border:1px solid var(--gold)}.bdg i{display:block;font-style:normal;font-size:22px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.kpi b{display:block;font-size:24px;line-height:1.15;color:var(--navy);font-variant-numeric:tabular-nums}.kpi span{font-size:13px;color:var(--mut)}
.bar{height:10px;background:#e6ecf6;border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--gtt);border-radius:6px}
.codebox{background:#0b1f3f;color:#fff;border-radius:16px;padding:16px;text-align:center;margin:12px 0}.codebox small{color:#b9cdf5;display:block}.codebox .big{font-size:28px;font-weight:800;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.safe{background:var(--warnbg);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:14.5px;margin:10px 0}
.empty{text-align:center;padding:22px 12px;color:var(--mut)}.empty i{display:block;font-style:normal;font-size:36px;margin-bottom:6px}
.hero{background:linear-gradient(150deg,#0b1f3f,#1d5fd1);color:#fff;border-radius:20px;padding:22px 18px;margin-bottom:14px}.hero h1{color:#fff}.hero p{color:#d6e4ff;font-size:16px}
.steps{display:grid;gap:8px;margin-bottom:14px}.steps div{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.steps i{font-style:normal;flex:0 0 32px;height:32px;border-radius:50%;background:#e8effb;color:var(--blue);font-weight:800;display:flex;align-items:center;justify-content:center}
.demo{background:#fffaf0;border:1.5px dashed var(--gold);border-radius:16px;padding:14px;margin-top:14px}.demo button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;cursor:pointer;min-height:52px;gap:8px}.demo button small{color:var(--mut);display:block;font-size:13px}
.logos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.logos div{background:#fff;border:1px dashed #c5d1e6;border-radius:12px;min-height:56px;display:flex;align-items:center;justify-content:center;font-size:12.5px;color:#6b7891;text-align:center;padding:6px}
nav.tab{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:9;max-width:560px;margin:0 auto}
nav.tab button{flex:1;border:0;background:none;padding:7px 2px;font-size:12.5px;font-weight:700;color:var(--mut);cursor:pointer;min-height:62px;display:flex;flex-direction:column;align-items:center;gap:2px}nav.tab button span{font-size:22px;line-height:1}nav.tab button.on{color:var(--blue)}
.sheet{position:fixed;inset:0;background:rgba(11,31,63,.5);display:none;align-items:flex-end;justify-content:center;z-index:30}.sheet.on{display:flex}.sheet-in{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:88dvh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}
.sheet-in .x{float:right;border:0;background:#eef2f8;border-radius:12px;min-width:44px;min-height:44px;font-size:20px;cursor:pointer}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.cel{position:fixed;inset:0;background:rgba(11,31,63,.55);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}.cel.on{display:flex}.cel-in{background:#fff;border-radius:22px;padding:26px 20px 18px;max-width:380px;width:100%;text-align:center;animation:pop .3s ease-out}.cel-ic{width:76px;height:76px;border-radius:50%;background:var(--gtt);color:#fff;font-size:40px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}.cel-in h3{font-size:22px;margin:6px 0}.cel-in p{color:var(--mut)}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));background:#0b1f3f;color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;display:none;z-index:50;max-width:92%;text-align:center}
.speak{background:#e9f6f0;color:var(--gtt);border:0;border-radius:12px;min-height:48px;font-weight:700;padding:0 14px;cursor:pointer;margin-bottom:10px}
.stars{display:flex;gap:6px}.stars button{border:0;background:none;font-size:34px;color:#cfd7e4;cursor:pointer;min-width:44px;min-height:44px}.stars button.on{color:#f0a500}
.elder{font-size:19px}.elder .btn{min-height:60px;font-size:19px}
.link{background:none;border:0;color:var(--blue);font-weight:700;cursor:pointer;text-decoration:underline;padding:4px 0}
html.fz1 .app,html.fz1 nav.tab,html.fz1 .sheet-in{zoom:1.12}html.fz2 .app,html.fz2 nav.tab,html.fz2 .sheet-in{zoom:1.25}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.hero2{padding:8px 2px 16px}.hero2 h1{font-size:27px;line-height:1.2;margin-bottom:6px;text-wrap:balance}.hero2 p{color:var(--mut);font-size:16px}
.ways{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 12px}.ways button{background:#fff;border:1px solid var(--line);border-radius:14px;min-height:76px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}.ways button span{font-size:24px;line-height:1}
details.demo summary{cursor:pointer;list-style:none;min-height:44px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}details.demo summary::-webkit-details-marker{display:none}details.demo summary::after{content:'▾';margin-left:auto;color:var(--mut)}details.demo[open] summary::after{content:'▴'}
.mini-badges{background:rgba(255,255,255,.12);border:0;border-radius:12px;padding:6px 8px;color:#fff;cursor:pointer;display:grid;grid-template-columns:repeat(3,22px);gap:2px;justify-items:center;align-items:center}.mini-badges i{font-style:normal;font-size:15px;line-height:22px;opacity:.45}.mini-badges i.dat{opacity:1}.mini-badges small{grid-column:1/-1;font-size:11px;color:#cfe0ff}

/* Màn chính: một nút chính + lưới đủ chức năng, vừa một màn hình điện thoại */
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border:0;border-radius:16px;background:#1d5fd1;color:#fff;font:700 17px/1.2 inherit;cursor:pointer;margin-bottom:10px}
.cta span{font-size:20px}
.fa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.fa button{background:#fff;border:1.5px solid var(--line);border-radius:14px;min-height:80px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:700 14px/1.25 inherit;color:var(--ink,#0b1f3f);text-align:center;cursor:pointer}
.fa button span{font-size:24px;line-height:1}
.fa button:focus-visible,.cta:focus-visible{outline:3px solid #f4cf6a;outline-offset:2px}

function geoP() { return new Promise(res => { if (!navigator.geolocation) return res(null); navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude }), () => res(null), { timeout: 10000, maximumAge: 120000 }); }); }
function geo(cb) { if (!navigator.geolocation) { toast('Máy không hỗ trợ định vị.'); return; } navigator.geolocation.getCurrentPosition(p => cb({ lat: p.coords.latitude, lng: p.coords.longitude }), () => toast('Chưa lấy được vị trí. Có thể bỏ qua.'), { timeout: 8000, maximumAge: 60000 }); }
function shrink(file, cb) { const r = new FileReader(); r.onload = () => { const img = new Image(); img.onload = () => { const s = Math.min(1, 320 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); let q = .6, d = c.toDataURL('image/jpeg', q); while (d.length > 44000 && q > .2) { q -= .1; d = c.toDataURL('image/jpeg', q); } cb(d.length <= 44000 ? d : ''); }; img.src = r.result; }; r.readAsDataURL(file); }

function hoatDongDem() { const v = S.viec || {}; return (v.canXacNhan || []).length + (v.loiMoi || []).length; }
function hoatDongNhom() {
  const v = S.viec || {}, dangXong = s => s === 'xong';

    (v.canXacNhan || []).map(x => ({ t: `Xác nhận: ${x.nguoiGiup} đã giúp ${x.nguoiNhan || ''}`, extra: `${x.viec} · ${x.phut} phút` })),
    (v.loiMoi || []).map(x => ({ t: `${x.tenNguoiMoi} mời bạn giúp: ${x.viec}`, extra: x.nguoiCan }))
  );
  const dang = [].concat(
    (v.nhoDang || []).filter(x => ['mo', 'da_nhan'].indexOf(x.trangThai) >= 0).map(x => ({ t: (x.loai === 'hoc' ? 'Muốn học: ' : 'Nhờ giúp: ') + x.viec, extra: TT_VIEC[x.trangThai][0], s: x.trangThai })),
    (v.nhoNhan || []).filter(x => x.trangThai === 'da_nhan').map(x => ({ t: 'Bạn nhận giúp: ' + x.viec, extra: x.nguoiCan, s: x.trangThai })),
    (v.ycDat || []).filter(x => ['moi', 'da_nhan'].indexOf(x.trangThai) >= 0).map(x => ({ t: 'Có thù lao: ' + x.moTa, extra: TT_VIEC[x.trangThai][0], s: x.trangThai })),
    (v.ycLam || []).filter(x => x.trangThai === 'da_nhan').map(x => ({ t: 'Bạn nhận làm: ' + x.moTa, extra: x.nguoiCan, s: x.trangThai })),
    ((S.toi.ghiDanh || [])).filter(x => x.trangThai === 'dang_hoc' || x.trangThai === 'cho_tai_tro').map(x => ({ t: 'Đang học: ' + x.khoa, extra: x.trangThai === 'cho_tai_tro' ? 'Chờ suất tài trợ' : 'Đang học', s: x.trangThai }))
  );
  const xong = [].concat(
    (v.nhoDang || []).concat(v.nhoNhan || []).filter(x => dangXong(x.trangThai)).map(x => ({ t: (x.loai === 'hoc' ? 'Muốn học: ' : 'Nhờ giúp: ') + x.viec, extra: 'Đã xong' })),
    (v.ycDat || []).concat(v.ycLam || []).filter(x => dangXong(x.trangThai)).map(x => ({ t: 'Có thù lao: ' + x.moTa, extra: 'Đã xong' })),
    (S.toi.phieu || []).filter(x => x.trangThai !== 'chua_dung').map(x => ({ t: 'Phiếu ' + x.ten, extra: 'Đã dùng' }))
  );
  return { canXL, dang, xong };
}

  if (S.done) { const d = S.done; return `<div class="msg ok"><b>Đã ghi nhận.</b> ${fmt(d.gio)} giờ đang chờ xác nhận.</div>${d.coTK ? '<p class="note">Người được giúp có tài khoản: họ (hoặc người thân) sẽ thấy ca này ở Trang chủ để xác nhận ngay. Bạn vẫn có thể gửi link.</p>' : ''}<div class="codebox"><small>Mã ca</small><div class="big">${esc(d.ma)}</div><small style="margin-top:8px">Mã xác nhận (chỉ hiện một lần)</small><div class="big">${esc(d.otp)}</div></div><p class="sub">Gửi lời nhắn này cho người được giúp. Họ bấm link là xác nhận được.</p><div class="stack"><button class="btn" data-act="sharecode">Gửi cho người được giúp</button><button class="btn alt" data-act="copycode">Sao chép lời nhắn</button><button class="btn ghost" data-act="ghimoi">Ghi nhận việc khác</button></div>`; }
  const g = S.ghi || (S.ghi = { phut: 60, q: {}, viec: '' });
  return `<h2>Ghi nhận một việc tử tế</h2><p class="sub">Người được giúp sẽ xác nhận. Khi đó giờ vào ví của bạn.</p>${g.maNho ? `<div class="msg ok">Từ việc bạn đã nhận: ${esc(g.nguoiNhan)}. Đã điền sẵn.</div>` : ''}
<div class="card">${g.maNho ? '' : `<label class="t" for="g-nhan" style="margin-top:0">Bạn giúp ai?</label><input type="text" id="g-nhan" maxlength="60" placeholder="Ví dụ: Bác Hạnh" value="${esc(g.nguoiNhan || '')}">`}
<label class="t" for="g-viec">Bạn đã làm việc gì?</label><select id="g-viec">${optViec(g.viec)}</select><div id="g-viec-canh"></div>
<label class="t">Mất bao lâu?</label><div class="chips" id="g-mins">${[15, 30, 45, 60, 90, 120].map(m => `<button type="button" class="chip${g.phut === m ? ' on' : ''}" data-m="${m}">${m} phút</button>`).join('')}</div><input type="number" id="g-phut" inputmode="numeric" min="15" max="600" placeholder="Hoặc nhập số phút" style="margin-top:10px"><p id="g-live" style="margin-top:8px;font-weight:700;color:var(--gtt)"></p></div>
<div class="card"><b>Trả lời nhanh về an toàn</b>${[['paid', 'Việc này đã được trả tiền công?'], ['med', 'Có kết luận bệnh, đổi thuốc, thủ thuật y khoa?'], ['sell', 'Có chào bán hàng, tư vấn tài chính?'], ['emg', 'Có dấu hiệu cấp cứu (đau ngực, khó thở, yếu liệt)?']].map(q => `<div style="margin-top:12px"><p style="font-size:15.5px">${q[1]}</p><div class="seg" style="margin:6px 0 0" data-q="${q[0]}"><button type="button" class="${g.q[q[0]] ? '' : 'on'}" data-v="0">Không</button><button type="button" class="${g.q[q[0]] ? 'on' : ''}" data-v="1">Có</button></div></div>`).join('')}</div>
<div class="card"><b>Minh chứng</b> <span class="note">(không bắt buộc, tăng mức tin cậy)</span><div class="row" style="margin-top:10px"><label class="btn alt" style="cursor:pointer">📷 Ảnh<input type="file" id="g-anh" accept="image/*" capture="environment" style="display:none"></label><button class="btn alt" type="button" id="g-geo">📍 Vị trí</button></div><p class="note" id="g-proof" style="margin-top:6px">${g.anh ? '✓ Đã có ảnh. ' : ''}${g.geo ? '✓ Đã gắn vị trí. ' : ''}Không chụp mặt người được giúp nếu họ chưa đồng ý.</p>
<label class="t" for="g-note">Ghi chú ngắn (không ghi thông tin bệnh)</label><textarea id="g-note" maxlength="240"></textarea></div>
<label class="chk"><input type="checkbox" id="g-dy"><span>Người được giúp <b>đồng ý</b> để EFCARE lưu thông tin của việc này.</span></label><div id="g-msg"></div>
<button class="btn" id="g-go" style="margin-top:14px"><span class="sp"></span><span>Ghi nhận</span></button>`;
};
VIEW._ghi = () => {
  if (S.done) return; const g = S.ghi;
  const live = () => { $('g-live').textContent = g.phut >= 15 ? `Được ghi nhận: ${fmt(gtt(g.phut))} giờ` : 'Cần ít nhất 15 phút'; }; live();
  [...$('g-mins').children].forEach(c => c.onclick = () => { g.phut = +c.dataset.m; $('g-phut').value = ''; [...$('g-mins').children].forEach(x => x.classList.toggle('on', x === c)); live(); });
  $('g-phut').oninput = () => { g.phut = +$('g-phut').value; [...$('g-mins').children].forEach(x => x.classList.remove('on')); live(); };
  document.querySelectorAll('[data-q]').forEach(sg => [...sg.children].forEach(b => b.onclick = () => { g.q[sg.dataset.q] = +b.dataset.v; [...sg.children].forEach(x => x.classList.toggle('on', x === b)); }));
  const proof = () => { $('g-proof').textContent = (g.anh ? '✓ Đã có ảnh. ' : '') + (g.geo ? '✓ Đã gắn vị trí. ' : '') + 'Không chụp mặt người được giúp nếu họ chưa đồng ý.'; };
  $('g-anh').onchange = function () { const f = this.files && this.files[0]; if (f) shrink(f, d => { g.anh = d; if (!d) toast('Ảnh quá lớn, thử ảnh khác.'); proof(); }); };
  $('g-geo').onclick = () => geo(x => { g.geo = x; proof(); });
  wireCanhBao('g-viec', 'g-viec-canh');
  $('g-go').onclick = () => { g.viec = val('g-viec'); if ($('g-nhan')) g.nguoiNhan = val('g-nhan');
    run($('g-go'), 'gttTaoCa', [S.phien, { viec: g.viec, nguoiNhan: g.nguoiNhan, phut: g.phut, maNho: g.maNho, ghiChu: val('g-note'), dongY: val('g-dy'), paid: !!g.q.paid, med: !!g.q.med, sell: !!g.q.sell, emg: !!g.q.emg, geo: g.geo, anh: g.anh, dev: DEV }], async r => { S.done = { ma: r.ma, otp: r.otp, gio: r.gio, nguoiNhan: g.nguoiNhan, phut: g.phut, coTK: !!g.maNho }; S.ghi = null; await loadMe(); render(); }, $('g-msg')); };
};
const codeMsg = () => { const d = S.done; return `Chào ${d.nguoiNhan}, ${S.toi.toi.ten} vừa ghi nhận một việc tử tế dành cho bạn (${d.phut} phút). Nếu đúng, bạn bấm xác nhận giúp nhé: ${BASE}?ca=${encodeURIComponent(d.ma)}&ma=${encodeURIComponent(d.otp)}\nMã ca: ${d.ma} · Mã xác nhận: ${d.otp}`; };
ACT.sharecode = () => share(codeMsg()); ACT.copycode = () => copy(codeMsg()); ACT.ghimoi = () => { S.done = null; S.ghi = null; render(); };

/* ---------- VÍ: 4 khu vực (Tổng quan GTT · Đổi hàng & Ưu đãi · Lịch sử GTT · Giải thích GTT) ---------- */
function soGhiNhan_(ls) { return r2_(ls.filter(x => x.gio >= 0).reduce((a, x) => a + x.gio, 0)); }
function soSuDung_(ls) { return r2_(ls.filter(x => x.gio < 0).reduce((a, x) => a - x.gio, 0)); }
function r2_(n) { return Math.round(n * 100) / 100; }
VIEW.vi = () => {
  const r = S.toi, s = S.viSeg;
  let body = '';
  if (s === 'tong') {
    const ghiNhan = soGhiNhan_(r.lichSu), suDung = soSuDung_(r.lichSu);
    const goiY = (S.cfg.uuDai || []).filter(u => u.doiDuoc && !u.choQuy && r.soDu >= u.gio).slice(0, 2);
    body = `<div class="card"><div class="li"><span class="l">GTT có thể đổi</span><b>${fmt(r.soDu)} giờ</b></div><div class="li"><span class="l">Tổng đã ghi nhận</span><span class="pos">+${fmt(ghiNhan)}</span></div><div class="li"><span class="l">Đã sử dụng</span><span class="neg">−${fmt(suDung)}</span></div><div class="li"><span class="l">Giờ đóng góp thực tế (đã xác nhận)</span><b>${fmt(r.thongKe.gioDaGiup)} giờ</b></div></div>
<p class="note" style="margin:10px 0">Đây chỉ là giờ của riêng bạn trong Sổ giờ chung. GTT do đối tác tài trợ cho chương trình không tính vào ví cá nhân.</p>
<div class="row"><button class="btn alt" data-act="tangsheet">🎁 Tặng giờ</button><button class="btn alt" data-act="viseg" data-s="doi">🛍️ Đổi hàng & Ưu đãi</button></div>
${goiY.length ? `<h3 style="margin-top:16px">Có thể đổi ngay</h3><div class="card">${goiY.map(u => `<div class="li"><span class="l">${esc(u.ten)}<br><span class="note">${esc(u.doiTac)}</span></span><b>${fmt(u.gio)} giờ</b></div>`).join('')}</div>` : ''}`;
  }
  if (s === 'doi') body = (S.cfg.uuDai || []).length ? S.cfg.uuDai.map(u => `<div class="job">${phAnh(u.anh, 160, quaIcon(u.loaiQua))}${u.quyTra ? pill('Đối tác bán · Quỹ trả thay bạn', 'p-gtt') : pill('Đối tác tài trợ', 'p-san')} ${pill(esc(u.tenLoai || 'Hàng hoá'), 'p-mut')}<h4>${esc(u.ten)}</h4><div class="meta">${u.quyTra ? '<b>' + esc(u.doiTac) + '</b> bán, quỹ thanh toán cho đối tác' : 'Do <b>' + esc(u.doiTac) + '</b> tài trợ, quỹ không trả tiền'}</div><div class="meta">Giá trị <b>${vnd(u.giaTri)} đ</b> · đổi bằng <b>${fmt(u.gio)} giờ</b>${u.conLai !== null ? ' · còn ' + u.conLai + ' suất' : ''}</div><p class="note" style="margin-bottom:10px">${esc(u.moTa)}</p><button class="btn alt" data-act="doiqua" data-ma="${u.ma}"${r.soDu < u.gio || !u.doiDuoc ? ' disabled' : ''}><span class="sp"></span><span>${u.choQuy ? 'Mở khi có quỹ' : !u.doiDuoc ? 'Tạm chưa đổi được' : r.soDu < u.gio ? 'Chưa đủ giờ' : 'Đổi ' + fmt(u.gio) + ' giờ'}</span></button></div>`).join('') : '<div class="empty"><i>🎁</i>Chưa có ưu đãi.</div>';
  if (s === 'ls') {
    const ghi = r.lichSu.filter(x => x.gio >= 0), dung = r.lichSu.filter(x => x.gio < 0);
    const row = x => `<div class="li"><span class="l">${esc(LOAI_SO[x.loai] || x.loai)}<br><span class="note">${dt(x.luc)}${x.ghiChu ? ' · ' + esc(tenViec(x.ghiChu) || x.ghiChu) : ''}</span></span><span class="${x.gio >= 0 ? 'pos' : 'neg'}">${x.gio >= 0 ? '+' : ''}${fmt(x.gio)}</span></div>`;
    body = `<h3>Giờ đã ghi nhận</h3>${ghi.length ? `<div class="card">${ghi.map(row).join('')}</div>` : '<div class="empty"><i>📒</i>Chưa có.</div>'}
<h3 style="margin-top:14px">Giờ đã sử dụng</h3>${dung.length ? `<div class="card">${dung.map(row).join('')}</div>` : '<div class="empty"><i>📒</i>Chưa có.</div>'}
<h3 style="margin-top:14px">Phiếu đổi quà</h3><p class="note" style="margin-bottom:8px">Riêng với Sổ giờ, không gộp chung.</p>${r.phieu.length ? `<div class="card">${r.phieu.map(p => `<div class="li"><span class="l"><b>${esc(p.ma)}</b> · ${esc(p.ten)}<br><span class="note">${esc(p.doiTac)} · ${fmt(p.gio)} giờ · ${dt(p.tao)}</span></span>${p.trangThai === 'chua_dung' ? pill('Đưa mã cho cửa hàng', 'p-warn') : pill('Đã dùng', 'p-gtt')}</div>`).join('')}</div>` : '<div class="empty"><i>🧾</i>Chưa có phiếu.</div>'}
<p class="note" style="margin-top:10px">Không xoá lịch sử giao dịch.</p>`;
  }
  if (s === 'giai') body = `<div class="card">
<p><b>GTT (Giờ Tử Tế) không phải tiền.</b></p>
<p class="note">GTT ghi lại việc tử tế bạn đã làm hoặc được giúp, tính bằng giờ. Không mua bán, không chuyển nhượng cho người lạ, không đổi ngược lại thành tiền mặt.</p>
<p style="margin-top:10px"><b>GTT dùng để làm gì?</b></p>
<p class="note">Đổi quà, ưu đãi do đối tác tài trợ ở mục "Đổi hàng & Ưu đãi". Tặng cho người thân. Để lại cho người thừa kế bạn chọn ở mục Tôi.</p>
<p style="margin-top:10px"><b>GTT đến từ đâu?</b></p>
<p class="note">Mỗi lần một việc tử tế được người nhận xác nhận, bạn được ghi thêm giờ vào Sổ giờ của mình. Việc có thù lao trên Sàn năng lực là tiền, không phải GTT, trừ khi bạn chọn lối nhận "ghi giờ".</p>
<p style="margin-top:10px"><b>Vì sao không rút ra tiền?</b></p>
<p class="note">GTT ghi nhận lòng tốt, giữ cho mọi người bình đẳng khi đổi quà, không ai dùng tiền để mua được nhiều GTT hơn người khác.</p>
</div>`;
  return `<div class="bal"><small>Ví GTT của ${esc(r.toi.ten)}</small><b class="big">${fmt(r.soDu)} giờ</b><small>${r.giaQuyDoi ? `Khi đổi quà quỹ bảo chứng: 1 giờ ≈ ${vnd(r.giaQuyDoi)} đ hàng hoá` : 'Quỹ đang chờ tài trợ để bảo chứng quà'}</small></div>
<div class="seg" style="overflow-x:auto">${[['tong', 'Tổng quan'], ['doi', 'Đổi hàng & Ưu đãi'], ['ls', 'Lịch sử GTT'], ['giai', 'Giải thích GTT']].map(x => `<button class="${s === x[0] ? 'on' : ''}" data-act="viseg" data-s="${x[0]}">${x[1]}</button>`).join('')}</div>${body}
<p class="note" style="margin-top:12px">Giờ không rút ra tiền mặt, không trả lãi, không đổi ngược. Giờ còn lại có thể để thừa kế cho người thân (đặt ở mục Tôi).</p>`;
};
ACT.viseg = b => { S.viSeg = b.dataset.s; render(); };
ACT.doiqua = b => { const u = S.cfg.uuDai.find(x => x.ma === b.dataset.ma); confirmBox(`Đổi ${fmt(u.gio)} giờ lấy "${u.ten}" (giá trị ${vnd(u.giaTri)} đ, ${u.quyTra ? u.doiTac + ' bán, quỹ trả' : 'do ' + u.doiTac + ' tài trợ'})?`, () => run(b, 'uuDaiDoi', [S.phien, u.ma], async r => { await refresh(); celebrate('Đã đổi quà', `Mã phiếu: ${r.maPhieu}. Đưa mã này cho ${r.doiTac} khi đến nhận.`); })); };
ACT.tangsheet = () => {
  const r = S.toi, gd = r.giaDinh, mem = gd ? gd.thanhVien.filter(m => m.efc !== r.toi.efc && m.trangThai !== 'da_mat') : [];
  sheet(`<button class="x" data-act="close" aria-label="Đóng">×</button><h2>Tặng giờ</h2><p class="sub">Tặng cho cha mẹ, ông bà, người thân hoặc bất kỳ ai có tài khoản.</p>${mem.length ? `<label class="t" for="t-to">Người trong gia đình</label><select id="t-to"><option value="">Chọn người</option>${mem.map(m => `<option value="${m.efc}">${esc(m.ten)}${m.vai ? ' (' + esc(m.vai) + ')' : ''}</option>`).join('')}</select>` : ''}<label class="t" for="t-ma">${mem.length ? 'Hoặc nhập' : 'Nhập'} mã thành viên</label><input type="text" id="t-ma" autocapitalize="characters" placeholder="EFC-000001"><label class="t" for="t-gio">Số giờ</label><input type="number" id="t-gio" step="0.25" min="0.25" value="1" inputmode="decimal"><label class="t" for="t-ln">Lời nhắn</label><input type="text" id="t-ln" maxlength="120" placeholder="Con tặng mẹ"><div id="t-msg"></div><button class="btn" id="t-go" style="margin-top:12px"><span class="sp"></span><span>Tặng giờ</span></button>`);
  $('t-go').onclick = () => ACT.tang($('t-go'));
};
ACT.tang = b => { const to = val('t-ma') || val('t-to'); run(b, 'tangGio', [S.phien, to, val('t-gio'), val('t-ln')], async r => { await loadMe(); closeSheet(); celebrate('Đã tặng giờ', `Bạn vừa tặng ${val('t-gio')} giờ cho ${r.nguoiNhan}.`); render(); }, $('t-msg')); };

/* ---------- TÔI ---------- */
VIEW.toi = () => {
  const r = S.toi, t = r.toi, gd = r.giaDinh, mem = gd ? gd.thanhVien.filter(m => m.efc !== t.efc) : [];
  const xm = k => t.xm[k] === 'dat' ? pill('Đã đủ điều kiện', 'p-gtt') : t.xm[k] === 'cho' ? pill('Đang chờ xác minh', 'p-warn') : t.xm[k] === 'khong' ? pill('Chưa đạt', 'p-no') : pill('Chưa có', 'p-mut');
  return `<div class="card"><h2 style="margin:0">${esc(t.ten)}</h2><p class="note">${esc(t.efc)} · ${esc(t.sdt)} · sinh năm ${t.namSinh}</p><label class="t" for="p-kv">Khu vực</label><div class="row"><input type="text" id="p-kv" value="${esc(t.khuVuc)}" placeholder="Phường, quận"><button class="btn sm alt" data-act="luukv" style="flex:0 0 auto">Lưu</button></div>
<label class="t" for="p-ns">Ngày sinh đầy đủ ${t.du55 ? pill('Đủ điều kiện Sàn năng lực 55+', 'p-gtt') : ''}</label><div class="row"><input type="date" id="p-ns" value="${esc(t.ngaySinh || '')}" max="${new Date().toISOString().slice(0, 10)}"><button class="btn sm alt" data-act="luungs" style="flex:0 0 auto">Lưu</button></div><p class="note" style="margin-top:4px">Cần để kiểm tra điều kiện nhận việc trên Sàn năng lực (từ 55 tuổi).</p>

<div id="dh-msg"></div><button class="btn" id="dh-go" data-act="dhgo" style="margin-top:12px"><span class="sp"></span><span>Gửi đăng ký</span></button>`);
  const up = () => { const v = val('dh-vai'); $('dh-qua').style.display = v === 'doi_tac' ? 'block' : 'none'; $('dh-vai-mt').textContent = DH_VAI.find(x => x[0] === v)[2] + (v === 'doi_tac' ? '' : ' Giai đoạn này chưa nhận tiền qua app; điều phối viên liên hệ trực tiếp.'); };

function dhDuyetHtml(ds) {
  return `<h3>Đăng ký đồng hành chờ duyệt (${ds.length})</h3><div class="card">${ds.map(x => `<div style="border-top:1px solid var(--line);padding:10px 0" id="dh-${x.ma}"><b>${esc(x.tenOrg)}</b> ${pill(x.tenVai, 'p-mut')}<p class="note">${esc(x.ma)} · ${esc(x.nguoi)} · ${esc(x.sdt)}${x.diaChi ? ' · ' + esc(x.diaChi) : ''}</p>${x.moTa ? `<p class="note">${esc(x.moTa)}</p>` : ''}${x.qua ? `<p class="note">Quà đầu tiên: <b>${esc(x.qua.ten)}</b> · giá trị ${vnd(x.qua.giaTri)} đ · ${x.qua.ban ? 'bán, quỹ trả' : 'tặng'} · ${fmt(x.qua.gio)} giờ${x.qua.soLuong ? ' · ' + x.qua.soLuong + ' suất' : ''}</p>` : ''}<p class="note">Bằng chứng: ${esc(x.bangChung || 'chưa ghi')}</p><p class="note" style="margin-top:6px"><b>Đã kiểm 5 cam kết</b> (gọi điện, xem giấy tờ, bảng giá):</p>${['Có ích thật, không quảng bá bằng nỗi sợ', 'Ghi rõ giá trị, tặng hay bán, điều kiện', 'Có người phụ trách, làm theo hướng dẫn', 'Phục vụ như khách trả tiền, trong chuyên môn', 'Đồng ý báo cáo số liệu thật'].map((c, i) => `<label class="chk"><input type="checkbox" id="dk-${x.ma}-${i}"><span>${c}</span></label>`).join('')}<label class="t" for="dk-ly-${x.ma}">Lý do nếu trả lại</label><input type="text" id="dk-ly-${x.ma}" maxlength="200"><div class="row" style="margin-top:8px"><button class="btn sm ok" data-act="dhduyet" data-ma="${x.ma}"><span class="sp"></span><span>Duyệt</span></button><button class="btn sm no" data-act="dhtra" data-ma="${x.ma}"><span class="sp"></span><span>Trả lại</span></button></div></div>`).join('') || '<p class="note">Chưa có đăng ký mới.</p>'}</div>`;
}

ACT.dhtra = b => { const ma = b.dataset.ma; run(b, 'dpDuyetDoiTac', [S.phien, ma, false, [], val('dk-ly-' + ma)], () => { toast('Đã trả lại kèm lý do.'); render(); }); };

ACT.knbang = b => { const k = b.dataset.k, n = b.dataset.n; sheet(`<button class="x" data-act="close" aria-label="Đóng">×</button><h2>Bằng cấp cho kỹ năng</h2><p class="sub">${esc(n)}</p><label class="t" for="kb-ten">Tên bằng, chứng chỉ</label><input type="text" id="kb-ten" maxlength="100" placeholder="Chứng chỉ điều dưỡng"><label class="t" for="kb-noi">Nơi cấp</label><input type="text" id="kb-noi" maxlength="100" placeholder="Trường Cao đẳng Y tế Hà Nội"><div class="row"><div><label class="t" for="kb-so">Số hiệu (nếu có)</label><input type="text" id="kb-so" maxlength="40"></div><div><label class="t" for="kb-nam">Năm cấp</label><input type="number" id="kb-nam" min="1950" max="2100" inputmode="numeric"></div></div><p class="note">Điều phối viên sẽ gọi để xem bản gốc hoặc ảnh bằng. Ứng dụng chỉ lưu thông tin bạn ghi ở đây, không lưu ảnh bằng.</p><div id="kb-msg"></div><button class="btn" id="kb-go" data-act="knbanggo" data-k="${esc(k)}" style="margin-top:12px"><span class="sp"></span><span>Gửi xác minh</span></button>`); };

ACT.knxin = b => { const k = b.dataset.k, n = b.dataset.n; sheet(`<button class="x" data-act="close" aria-label="Đóng">×</button><h2>Nhờ cộng đồng xác nhận</h2><p class="sub">${esc(n)}</p><p class="note">Nhờ người <b>ngoài gia đình</b>, đã <b>trực tiếp thấy</b> bạn làm việc này: hàng xóm, người bạn từng giúp, đồng nghiệp cũ. Đủ 2 người xác nhận là bạn nhận được việc có thù lao tầng C.</p><label class="t" for="kx-ai">Số điện thoại hoặc mã thành viên của họ</label><input type="text" id="kx-ai" inputmode="tel" placeholder="09xx xxx xxx hoặc EFC-000123"><label class="t" for="kx-ln">Lời nhắn</label><input type="text" id="kx-ln" maxlength="120" placeholder="Chú nhớ hồi cháu cài điện thoại cho bác Tư không ạ?"><p class="note">Người đó cần có tài khoản EFCommunity. Họ sẽ thấy lời nhờ ở trang chủ.</p><div id="kx-msg"></div><button class="btn" id="kx-go" data-act="knxingo" data-k="${esc(k)}" style="margin-top:12px"><span class="sp"></span><span>Gửi lời nhờ</span></button>`); };
ACT.knxingo = b => run(b, 'knXinXacNhan', [S.phien, b.dataset.k, val('kx-ai'), val('kx-ln')], async r => { closeSheet(); await loadMe(); toast('Đã gửi lời nhờ tới ' + r.ten + '.'); render(); }, $('kx-msg'));
ACT.kntl = b => { const x = ((S.toi && S.toi.nhoXnKN) || []).find(y => y.ma === b.dataset.ma); if (!x) return; sheet(`<button class="x" data-act="close" aria-label="Đóng">×</button><h2>Xác nhận kỹ năng</h2><p class="sub"><b>${esc(x.nguoi)}</b> nhờ bạn xác nhận: <b>${esc(x.kyNang)}</b></p>${x.loiNhan ? `<p class="note">“${esc(x.loiNhan)}”</p>` : ''}<label class="chk"><input type="checkbox" id="tl-thay"><span>Tôi đã trực tiếp thấy ${esc(x.nguoi)} làm việc này, làm được và làm cẩn thận.</span></label><p class="note">Xác nhận của bạn giúp người khác có việc làm. Chỉ xác nhận điều bạn đã thấy.</p><div id="tl-msg"></div><div class="row" style="margin-top:12px"><button class="btn ok" id="tl-co" data-act="kntlgo" data-ma="${x.ma}" data-d="1"><span class="sp"></span><span>Xác nhận</span></button><button class="btn alt" id="tl-ko" data-act="kntlgo" data-ma="${x.ma}" data-d="0"><span class="sp"></span><span>Tôi chưa thấy</span></button></div>`); };
ACT.kntlgo = b => run(b, 'knTraLoi', [S.phien, b.dataset.ma, b.dataset.d === '1', val('tl-thay')], async () => { closeSheet(); await loadMe(); toast(b.dataset.d === '1' ? 'Cảm ơn bạn đã xác nhận.' : 'Đã trả lời.'); render(); }, $('tl-msg'));
ACT.bcxm = b => run(b, 'dpXacMinhBang', [S.phien, b.dataset.e, b.dataset.k, b.dataset.d === '1'], () => { toast(b.dataset.d === '1' ? 'Đã xác minh bằng cấp.' : 'Đã ghi chưa đạt.'); render(); });
window.__EF = { S, ACT, render, api };
boot();
